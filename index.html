<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPN → SEPA QR</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  h1 {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  p.lede {
    color: #6e6e73;
    margin: 0 0 28px;
  }
  #dropzone {
    border: 2px dashed #c7c7cc;
    border-radius: 16px;
    padding: 56px 20px;
    text-align: center;
    cursor: pointer;
    background: #fff;
    transition: border-color .15s, background .15s, transform .1s;
    user-select: none;
  }
  #dropzone:hover, #dropzone.drag {
    border-color: #007aff;
    background: #f0f7ff;
  }
  #dropzone:active { transform: scale(.995); }
  #dropzone p { margin: 0; color: #6e6e73; }
  #dropzone .busy-text, #dropzone.busy .idle-text { display: none; }
  #dropzone.busy .busy-text { display: block; }
  #cameraBtn {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 13px 20px;
    border: 0;
    border-radius: 12px;
    background: #fff;
    color: #007aff;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  #cameraBtn:hover { background: #f0f7ff; }
  #cameraBtn:active { transform: scale(.995); }
  #scanner {
    position: relative;
    margin-top: 12px;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
  }
  #scanner video {
    display: block;
    width: 100%;
    max-height: 70vh;
    object-fit: cover;
  }
  #scanHint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    margin: 0;
    padding: 32px 16px 14px;
    color: #fff;
    font-size: 14px;
    text-align: center;
    background: linear-gradient(transparent, rgba(0,0,0,.65));
    pointer-events: none;
  }
  #scanClose {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 6px 14px;
    border: 0;
    border-radius: 999px;
    background: rgba(0,0,0,.55);
    color: #fff;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  kbd {
    background: #fff;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid #d1d1d6;
    font-size: 12px;
    font-family: inherit;
  }
  #error {
    margin-top: 16px;
    padding: 12px 16px;
    background: #ffe5e5;
    color: #8a1a1a;
    border-radius: 10px;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .hidden { display: none !important; }
  #result {
    margin-top: 24px;
    background: #fff;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  #qr {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }
  #qr svg {
    width: min(280px, 70vw);
    height: auto;
    display: block;
  }
  dl {
    margin: 0;
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 16px;
    font-size: 14px;
  }
  dt { color: #6e6e73; }
  dd { margin: 0; word-break: break-word; }
  details {
    margin-top: 22px;
    font-size: 13px;
  }
  summary { cursor: pointer; color: #6e6e73; }
  pre {
    margin: 10px 0 0;
    background: #f5f5f7;
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: #8e8e93;
    text-align: center;
  }
  footer a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  footer a:hover { color: #1d1d1f; }
  @media (prefers-color-scheme: dark) {
    footer a:hover { color: #f5f5f7; }
  }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #f5f5f7; }
    #dropzone { background: #1c1c1e; border-color: #3a3a3c; }
    #dropzone:hover, #dropzone.drag { background: #1a2030; border-color: #0a84ff; }
    #dropzone p, dt, summary, p.lede, footer { color: #98989d; }
    #cameraBtn { background: #1c1c1e; color: #0a84ff; }
    #cameraBtn:hover { background: #1a2030; }
    kbd { background: #2c2c2e; border-color: #3a3a3c; color: #f5f5f7; }
    #result { background: #1c1c1e; box-shadow: none; }
    pre { background: #2c2c2e; }
    #error { background: #3a1a1a; color: #ff9b9b; }
    #qr svg { background: #fff; padding: 12px; border-radius: 8px; }
  }
</style>
</head>
<body>
<main>
  <h1>UPN → SEPA QR</h1>
  <p class="lede">Paste a Slovenian UPN QR code. Get a SEPA QR you can scan in Revolut.</p>

  <div id="dropzone" tabindex="0">
    <p class="idle-text">Click to upload, paste an image with <kbd>⌘V</kbd>, or drop one here</p>
    <p class="busy-text">Reading QR code…</p>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <button id="cameraBtn" class="hidden" type="button">Scan with camera</button>

  <div id="scanner" class="hidden">
    <video id="video" playsinline muted></video>
    <p id="scanHint"></p>
    <button id="scanClose" type="button">Close</button>
  </div>

  <div id="error" class="hidden"></div>

  <div id="result" class="hidden">
    <div id="qr"></div>
    <dl id="details"></dl>
    <details>
      <summary>SEPA payload (raw)</summary>
      <pre id="payload"></pre>
    </details>
  </div>

  <footer>
    Runs entirely in your browser. Nothing leaves the page.
    · <a href="https://github.com/jkbpvsc/sepa-si" target="_blank" rel="noopener">Source on GitHub</a>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.7/dist/iife/reader/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const errorEl = document.getElementById('error');
const resultEl = document.getElementById('result');
const qrEl = document.getElementById('qr');
const detailsEl = document.getElementById('details');
const payloadEl = document.getElementById('payload');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
});
fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
  fileInput.value = '';
});

['dragenter', 'dragover'].forEach(ev =>
  dropzone.addEventListener(ev, (e) => {
    e.preventDefault();
    dropzone.classList.add('drag');
  })
);
['dragleave', 'drop'].forEach(ev =>
  dropzone.addEventListener(ev, () => dropzone.classList.remove('drag'))
);
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

window.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items || [];
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (file) { handleFile(file); return; }
    }
  }
  const text = e.clipboardData?.getData('text') || '';
  if (text.trim().startsWith('UPNQR')) processUPN(text);
});

// ---------------------------------------------------------------------------
// QR reading — ZXing-C++ compiled to WebAssembly.
//
// A UPN QR is a dense version-15 symbol, so in a phone photo of a bill each
// module is only a few pixels wide. One look at a downscaled copy is not
// enough: we read the photo at full resolution and, if that fails, retry
// sharpened, enlarged, and (for very large photos) tile by tile.
// ---------------------------------------------------------------------------
const READER_OPTIONS = {
  formats: ['QRCode'],
  tryHarder: true,
  tryRotate: true,
  tryInvert: true,
  tryDownscale: true,
  tryDenoise: true,
  maxNumberOfSymbols: 4,   // a bill can carry other QR codes next to the UPN one
  textMode: 'Plain',       // the default escapes control characters as "<LF>" in some payloads
};

// iOS Safari refuses canvases above ~16.7 megapixels.
const MAX_PIXELS = 16e6;

const hasReader = typeof ZXingWASM !== 'undefined';
// Fetch and compile the .wasm up front so the first read is instant.
if (hasReader) warmUpReader();

function warmUpReader() {
  ZXingWASM.prepareZXingModule({ fireImmediately: true })
    .catch((err) => console.warn('[UPN→SEPA] QR reader failed to preload:', err));
}

const work = document.createElement('canvas');
const workCtx = work.getContext('2d', { willReadFrequently: true });

// Draw a region of an image or video frame at w×h and return its pixels.
function grab(source, sx, sy, sw, sh, w, h) {
  work.width = w;
  work.height = h;
  workCtx.imageSmoothingQuality = 'high';
  workCtx.fillStyle = '#fff';            // transparent PNGs would read as black
  workCtx.fillRect(0, 0, w, h);
  workCtx.drawImage(source, sx, sy, sw, sh, 0, 0, w, h);
  return workCtx.getImageData(0, 0, w, h);
}

// Box blur of an 8-bit plane, written back into `plane` (`tmp` is scratch).
function boxBlur(plane, tmp, w, h, r) {
  const win = 2 * r + 1;
  for (let y = 0; y < h; y++) {
    const row = y * w;
    let sum = plane[row] * (r + 1);
    for (let x = 1; x <= r; x++) sum += plane[row + Math.min(x, w - 1)];
    for (let x = 0; x < w; x++) {
      tmp[row + x] = sum / win;
      sum += plane[row + Math.min(x + r + 1, w - 1)] - plane[row + Math.max(x - r, 0)];
    }
  }
  const col = new Float64Array(w);
  for (let x = 0; x < w; x++) col[x] = tmp[x] * (r + 1);
  for (let y = 1; y <= r; y++) {
    const row = Math.min(y, h - 1) * w;
    for (let x = 0; x < w; x++) col[x] += tmp[row + x];
  }
  for (let y = 0; y < h; y++) {
    const row = y * w, add = Math.min(y + r + 1, h - 1) * w, sub = Math.max(y - r, 0) * w;
    for (let x = 0; x < w; x++) {
      plane[row + x] = col[x] / win;
      col[x] += tmp[add + x] - tmp[sub + x];
    }
  }
}

// Unsharp mask, in place. Pulls a soft-focus QR back over the reader's threshold.
function sharpen(pixels) {
  const { data, width: w, height: h } = pixels;
  const n = w * h;
  const lum = new Uint8Array(n), blur = new Uint8Array(n), tmp = new Uint8Array(n);
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    lum[i] = (data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8;
  }
  blur.set(lum);
  // Two box blurs ≈ a Gaussian; radius follows resolution (σ ≈ 3px at 12 MP).
  const r = Math.max(2, Math.min(4, Math.round(Math.max(w, h) / 1200)));
  boxBlur(blur, tmp, w, h, r);
  boxBlur(blur, tmp, w, h, r);
  const AMOUNT = 5;
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    const v = lum[i] + AMOUNT * (lum[i] - blur[i]);
    data[p] = data[p + 1] = data[p + 2] = v < 0 ? 0 : v > 255 ? 255 : v;
  }
  return pixels;
}

// The views of a still image worth trying, cheapest and most likely first.
function* imagePasses(img) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const fit = Math.min(1, Math.sqrt(MAX_PIXELS / (W * H)));
  const bw = Math.round(W * fit), bh = Math.round(H * fit);

  const whole = grab(img, 0, 0, W, H, bw, bh);
  yield [`whole image ${bw}×${bh}`, whole];
  yield ['whole image, sharpened', sharpen(whole)];

  // Low-resolution pictures (messenger-compressed photos, webcam stills, codes
  // shot from far away): modules a pixel or two wide resolve once enlarged.
  const room = Math.sqrt(MAX_PIXELS / (bw * bh));
  for (const want of Math.max(bw, bh) <= 1200 ? [2, 3] : [2]) {
    const zoom = Math.min(want, room);
    if (zoom < want && zoom < 1.25) break;
    const big = grab(img, 0, 0, W, H, Math.round(bw * zoom), Math.round(bh * zoom));
    yield [`enlarged ×${zoom.toFixed(1)}`, big];
    yield [`enlarged ×${zoom.toFixed(1)}, sharpened`, sharpen(big)];
    if (zoom < want) break;
  }

  // Photos too big for one canvas were shrunk above — go back over them at
  // native resolution in overlapping tiles.
  if (fit < 1) {
    const tw = Math.ceil(W / 2), th = Math.ceil(H / 2);
    const k = Math.min(1, Math.sqrt(MAX_PIXELS / (tw * th)));
    for (const fy of [0, 0.5, 1]) {
      for (const fx of [0, 0.5, 1]) {
        const sx = Math.round((W - tw) * fx), sy = Math.round((H - th) * fy);
        yield [`tile at ${sx},${sy}`, grab(img, sx, sy, tw, th, Math.round(tw * k), Math.round(th * k))];
      }
    }
  }
}

// UPN QR is specified as ISO-8859-2 announced by an ECI header. With the
// header ZXing has already decoded the text; generators that leave it out
// leave us to work the charset out from the bytes.
function decodePayload(result) {
  if (result.hasECI && result.text) return result.text;
  const bytes = result.bytes;
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  } catch {}
  // 0x80–0x9F are control codes in ISO-8859-2 but letters (Š, Ž, š, ž) in Windows-1250.
  const cp1250 = bytes.some(b => b >= 0x80 && b <= 0x9f);
  return new TextDecoder(cp1250 ? 'windows-1250' : 'iso-8859-2').decode(bytes);
}

async function readQR(pixels) {
  let results;
  try {
    results = await ZXingWASM.readBarcodes(pixels, READER_OPTIONS);
  } catch (err) {
    console.error('[UPN→SEPA] QR reader error:', err);
    if (hasReader) ZXingWASM.purgeZXingModule();   // let the next attempt fetch it again
    throw new Error('Could not load the QR reader. Check your connection and try again.');
  }
  return results.filter(r => r.isValid).map(decodePayload);
}

const isUPN = (text) => /^[\s﻿]*UPNQR/i.test(text);
const pause = (ms = 0) => new Promise(resolve => setTimeout(resolve, ms));

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, release: () => URL.revokeObjectURL(url) });
    img.onerror = () => {
      URL.revokeObjectURL(url);
      const heic = /hei[cf]/i.test(file.type) || /\.hei[cf]$/i.test(file.name || '');
      reject(new Error(heic
        ? 'This browser cannot open HEIC photos. Export it as JPEG, or take a screenshot of the photo and paste that.'
        : 'Could not load that file as an image.'));
    };
    img.src = url;
  });
}

let currentJob = 0;

async function handleFile(file) {
  const job = ++currentJob;   // a newer drop/paste supersedes this one
  stopScanner();
  errorEl.classList.add('hidden');
  dropzone.classList.add('busy');
  let image = null;
  try {
    image = await loadImage(file);
    await pause(30);          // let "Reading QR code…" paint before the heavy work
    const started = performance.now();
    let hit = null, other = null, tried = 0;
    for (const [label, pixels] of imagePasses(image.img)) {
      tried++;
      const found = await readQR(pixels);
      if (job !== currentJob) return;
      const upn = found.find(isUPN);
      if (upn) { hit = { text: upn, label }; break; }
      other ??= found[0];
      await pause();          // keep the page responsive between passes
    }
    console.log(`[UPN→SEPA] QR decode: ${image.img.naturalWidth}×${image.img.naturalHeight},`,
      hit ? `read on pass ${tried} (${hit.label})`
        : `${other != null ? 'only a non-UPN code' : 'nothing'} after ${tried} passes`,
      `in ${Math.round(performance.now() - started)} ms`);
    if (hit) {
      processUPN(hit.text);
    } else if (other != null) {
      processUPN(other);      // some other QR — parseUPN explains what was in it
    } else {
      showError('No QR code found. Make sure the whole code is in the picture, in focus and evenly lit' +
        (canScan ? ' — or use “Scan with camera”.' : '.'));
    }
  } catch (err) {
    if (job === currentJob) showError(err.message);
  } finally {
    image?.release();
    if (job === currentJob) dropzone.classList.remove('busy');
  }
}

// ---------------------------------------------------------------------------
// Live camera scanning
// ---------------------------------------------------------------------------
const cameraBtn = document.getElementById('cameraBtn');
const scannerEl = document.getElementById('scanner');
const videoEl = document.getElementById('video');
const scanHint = document.getElementById('scanHint');
const scanClose = document.getElementById('scanClose');

const HINT_AIM = 'Point the camera at the UPN QR code';
const HINT_NOT_UPN = 'That QR code is not a UPN payment code';

// getUserMedia only exists on https:// and localhost.
const canScan = hasReader && !!navigator.mediaDevices?.getUserMedia;
if (canScan) cameraBtn.classList.remove('hidden');

let stream = null;
let scanSession = 0;

cameraBtn.addEventListener('click', startScanner);
scanClose.addEventListener('click', stopScanner);
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') stopScanner(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) stopScanner(); });

async function startScanner() {
  const session = ++scanSession;
  currentJob++;               // abandon any photo still being read
  dropzone.classList.remove('busy');
  errorEl.classList.add('hidden');
  let media;
  try {
    media = await navigator.mediaDevices.getUserMedia({
      audio: false,
      // The code is dense, so ask for more than the 640×480 default.
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    });
  } catch (err) {
    if (session === scanSession) showError(cameraError(err));
    return;
  }
  if (session !== scanSession) {            // closed or superseded while the prompt was open
    media.getTracks().forEach(t => t.stop());
    return;
  }
  stream = media;

  // Phones that expose focus control: keep refocusing as the bill moves.
  const [track] = stream.getVideoTracks();
  if (track.getCapabilities?.().focusMode?.includes('continuous')) {
    track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
  }

  scanHint.textContent = HINT_AIM;
  cameraBtn.classList.add('hidden');
  scannerEl.classList.remove('hidden');
  videoEl.srcObject = stream;
  try {
    await videoEl.play();
  } catch {}                  // interrupted by stopScanner(); the loop below exits
  scanLoop(session);
}

function stopScanner() {
  scanSession++;
  if (!stream) return;
  stream.getTracks().forEach(t => t.stop());
  stream = null;
  videoEl.srcObject = null;
  scannerEl.classList.add('hidden');
  if (canScan) cameraBtn.classList.remove('hidden');
}

async function scanLoop(session) {
  let frame = 0, otherSeenAt = -Infinity;
  while (session === scanSession) {
    const w = videoEl.videoWidth, h = videoEl.videoHeight;
    if (videoEl.readyState >= 2 && w && h) {
      // Alternate the whole frame with its centre enlarged ×2 and sharpened,
      // which picks up a code held too far from the lens for the plain read.
      const pixels = frame++ % 2
        ? sharpen(grab(videoEl, w / 4, h / 4, w / 2, h / 2, w, h))
        : grab(videoEl, 0, 0, w, h, w, h);
      let found;
      try {
        found = await readQR(pixels);
      } catch (err) {
        if (session === scanSession) { stopScanner(); showError(err.message); }
        return;
      }
      if (session !== scanSession) return;
      const upn = found.find(isUPN);
      if (upn) {
        console.log(`[UPN→SEPA] QR decode: camera frame ${w}×${h}, read after ${frame} frames`);
        stopScanner();
        processUPN(upn);
        return;
      }
      if (found.length) otherSeenAt = performance.now();
      scanHint.textContent = performance.now() - otherSeenAt < 1500 ? HINT_NOT_UPN : HINT_AIM;
    }
    await pause(60);
  }
}

function cameraError(err) {
  switch (err?.name) {
    case 'NotAllowedError':
    case 'SecurityError':
      return 'Camera access was blocked. Allow it for this page in your browser settings, or upload a photo instead.';
    case 'NotFoundError':
    case 'OverconstrainedError':
      return 'No camera found on this device. Upload a photo instead.';
    case 'NotReadableError':
    case 'AbortError':
      return 'The camera is in use by another app. Close it and try again.';
    default:
      return `Could not start the camera (${err?.message || err}).`;
  }
}

function processUPN(text) {
  console.group('[UPN→SEPA] Parse');
  console.log('Input text:', JSON.stringify(text));
  console.log('Lines:', text.split(/\r?\n/));
  try {
    const upn = parseUPN(text);
    console.log('Parsed UPN:', upn);
    const epc = buildEPC(upn);
    console.log('Built EPC payload:', JSON.stringify(epc));
    console.groupEnd();
    renderResult(upn, epc);
  } catch (err) {
    console.error('Parse error:', err);
    if (err.decoded) {
      console.error('Full decoded content:', JSON.stringify(err.decoded));
      console.error('Decoded as lines:', err.decoded.split(/\r?\n/));
    }
    console.groupEnd();
    if (err.decoded) {
      showError(`${err.message}\n\nDecoded content (first 200 chars):\n${err.preview}\n\n→ Open DevTools console for full output.`);
    } else {
      showError(err.message);
    }
  }
}

// UPN QR field layout (0-indexed lines):
//  0 UPNQR  1 payerIBAN  2 polog  3 dvig  4 payerRef
//  5 payerName  6 payerStreet  7 payerCity
//  8 amount (11 digits, last 2 are cents)
//  9 paymentDate  10 urgent  11 purposeCode  12 purposeText
// 13 dueDate  14 recipientIBAN  15 recipientRef
// 16 recipientName  17 recipientStreet  18 recipientCity
// 19 controlSum
function parseUPN(text) {
  // Strip BOM and leading whitespace, normalise line endings
  const clean = text.replace(/^﻿/, '').replace(/^\s+/, '');
  const lines = clean.split(/\r?\n/).map(l => l ?? '');
  if (lines[0].trim().toUpperCase() !== 'UPNQR') {
    const preview = clean.substring(0, 200).replace(/\n/g, ' ⏎ ');
    const err = new Error('Not a UPN QR code — UPNQR header missing.');
    err.decoded = clean;
    err.preview = preview;
    throw err;
  }
  while (lines.length < 20) lines.push('');

  const amountStr = lines[8].trim();
  const cents = parseInt(amountStr, 10);
  if (!Number.isFinite(cents) || cents < 0) {
    throw new Error('UPN QR has no valid amount.');
  }
  const amount = (cents / 100).toFixed(2);

  return {
    amount,
    purposeCode: lines[11].trim(),
    purpose: lines[12].trim(),
    dueDate: lines[13].trim(),
    recipientIban: lines[14].replace(/\s/g, '').trim().toUpperCase(),
    recipientRef: lines[15].trim(),
    recipientName: lines[16].trim(),
    recipientAddress: lines[17].trim(),
    recipientCity: lines[18].trim(),
  };
}

// EPC069-12 / EPC QR (SEPA Credit Transfer) format
function buildEPC(upn) {
  if (!upn.recipientIban) throw new Error('UPN QR missing recipient IBAN.');
  if (!upn.recipientName) throw new Error('UPN QR missing recipient name.');

  // The reference travels alone in its field, because it is the one thing the
  // creditor reconciles on. The purpose text is only sent when the bill has no
  // reference ("NRC" / model SI99 mean exactly that).
  const ref = upn.recipientRef.replace(/\s+/g, '').toUpperCase();
  const hasRef = ref !== '' && ref !== 'NRC' && ref !== 'SI99';
  // Only ISO 11649 "RF" references are valid in the structured field;
  // Slovenian SI-model references go in the unstructured one.
  const structured = /^RF\d{2}[A-Z0-9]{1,21}$/.test(ref) ? ref : '';
  const unstructured = structured ? '' : hasRef ? upn.recipientRef : upn.purpose;

  const fields = [
    'BCD',                                       // Service tag
    '002',                                       // Version (BIC optional)
    '1',                                         // UTF-8
    'SCT',                                       // SEPA Credit Transfer
    '',                                          // BIC (optional)
    upn.recipientName.substring(0, 70),          // Beneficiary name
    upn.recipientIban,                           // Beneficiary IBAN
    `EUR${upn.amount}`,                          // Amount
    upn.purposeCode.substring(0, 4),             // Purpose (optional)
    structured,                                  // Structured remittance (RF only)
    unstructured.substring(0, 140),              // Unstructured remittance
    '',                                          // Beneficiary-to-originator info
  ];
  // Trailing empty elements are left out rather than sent as blank lines;
  // strict readers trip over a payload that ends in a separator.
  while (fields.length > 8 && fields[fields.length - 1] === '') fields.pop();
  return fields.join('\n');
}

function renderResult(upn, epc) {
  errorEl.classList.add('hidden');
  resultEl.classList.remove('hidden');

  const qr = qrcode(0, 'M');
  qr.addData(epc);
  qr.make();
  qrEl.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });

  const rows = [
    ['Recipient', upn.recipientName],
    ['IBAN', upn.recipientIban],
    ['Amount', `€${upn.amount}`],
    ['Reference', upn.recipientRef || '—'],
    ['Purpose', upn.purpose || '—'],
    ['Due', upn.dueDate || '—'],
  ];
  detailsEl.innerHTML = rows.map(([k, v]) =>
    `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join('');
  payloadEl.textContent = epc;

  resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.classList.remove('hidden');
  resultEl.classList.add('hidden');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}
</script>
